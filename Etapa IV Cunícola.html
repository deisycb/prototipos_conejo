<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Etapa IV Cunícola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Work+Sans:wght@500;600;700&display=swap">
<style>
/* Layout: barra superior con pasos; pestañas MBR/MBA; lista de indicadores a la izquierda + detalle a la derecha; en celular la lista pasa a un selector */
:root{
  --green:#0b7a3e; --green-dark:#075a2d; --green-soft:#e6f2ea; --yellow:#f2c200; --yellow-soft:#fff6d1;
  --bg:#f6f8f6; --surface:#ffffff; --surface-2:#eef3ef; --fg:#14231a; --muted:#4f6157; --line:#cbd8cf; --line-strong:#14231a;
  --danger:#a3271b; --danger-soft:#fbe9e7; --warn:#8a5a00; --orange:#d9774a; --on-green:#ffffff;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Work Sans','Atkinson Hyperlegible',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --green:#3fae6d; --green-dark:#0d3d22; --green-soft:#16301f; --yellow:#f2c94c; --yellow-soft:#3a3214;
  --bg:#0f1712; --surface:#16211a; --surface-2:#1c2a21; --fg:#e8f0ea; --muted:#a5b8ab; --line:#2c3c31; --line-strong:#cfdcd3;
  --danger:#ff8a7a; --danger-soft:#3a1b17; --warn:#f2c94c; --on-green:#0f1712; color-scheme:dark}}
:root[data-theme="dark"]{
  --green:#3fae6d; --green-dark:#0d3d22; --green-soft:#16301f; --yellow:#f2c94c; --yellow-soft:#3a3214;
  --bg:#0f1712; --surface:#16211a; --surface-2:#1c2a21; --fg:#e8f0ea; --muted:#a5b8ab; --line:#2c3c31; --line-strong:#cfdcd3;
  --danger:#ff8a7a; --danger-soft:#3a1b17; --warn:#f2c94c; --on-green:#0f1712; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.topbar{background:var(--green-dark);color:#fff;border-bottom:4px solid var(--yellow);position:sticky;top:0;z-index:5}
.tb1{display:flex;align-items:center;gap:14px;padding:12px 24px 10px}
.back{width:42px;height:42px;border-radius:8px;border:2px solid #fff;color:#fff;display:grid;place-items:center;flex-shrink:0;text-decoration:none}
.back:hover{background:rgba(255,255,255,.12)}
.ttl{min-width:0;margin-right:auto}
.ttl b{font-family:var(--font-head);font-size:20px;display:block;line-height:1.2}
.ttl span{font-size:14px;color:#d6e8dc}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-head);font-weight:700;font-size:15px;color:#e3efe7;white-space:nowrap}
.mark{width:28px;height:28px;border-radius:7px;background:var(--yellow);color:#14231a;display:grid;place-items:center}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 24px 12px;list-style:none;margin:0}
.steps li{font-size:13px;color:#cfe3d6;display:flex;flex-direction:column;gap:6px;min-width:0}
.steps li::before{content:"";height:6px;border-radius:3px;background:rgba(255,255,255,.22)}
.steps li.on{color:#fff;font-weight:700}
.steps li.on::before{background:var(--yellow)}
.steps li.done::before{background:#fff}
.steps li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:1280px;margin:0 auto;padding:22px 24px 120px}
h1{margin:0 0 14px;font-family:var(--font-head);font-size:28px}
.scen{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px;padding:10px 14px;border:1.5px dashed var(--line);border-radius:10px;background:var(--surface)}
.scen b{font-size:14px}
.segb{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line-strong);border-radius:8px;overflow:hidden;flex:1 1 300px}
.segb button{border:0;border-right:1px solid var(--line);background:var(--surface);padding:8px 4px;font-size:15px;cursor:pointer}
.segb button:last-child{border-right:0}
.segb button[aria-pressed="true"]{background:var(--green);color:var(--on-green);font-weight:700}
.link{background:none;border:0;padding:0;color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tab{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.tab[aria-selected="true"]{border-color:var(--green);background:var(--green-soft)}
.tab .tt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tab b{font-family:var(--font-head);font-size:20px}
.tab small{color:var(--muted);font-size:14px}
.prog{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green)}
.work{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.list{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:150px;max-height:calc(100vh - 260px);overflow-y:auto}
.it{width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;min-height:56px}
.it:last-child{border-bottom:0}
.it .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.it .nm{flex:1;min-width:0;font-size:15px;line-height:1.25}
.it .nm small{display:block;color:var(--muted);font-size:12px}
.it[aria-current="true"]{background:var(--green-soft);box-shadow:inset 5px 0 0 var(--green)}
.it.na .nm{color:var(--muted)}
.chip{flex-shrink:0;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;border:1.5px solid var(--line)}
.c100{background:var(--green);border-color:var(--green);color:var(--on-green)}
.c55{background:var(--yellow-soft);border-color:var(--yellow);color:var(--fg)}
.c20{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.c0{background:var(--danger);border-color:var(--danger);color:#fff}
.cna{border-style:dashed;color:var(--muted)}
.mobsel{display:none}
.det{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.det h2{margin:4px 0 2px;font-family:var(--font-head);font-size:22px}
.meta{color:var(--muted);font-size:14px}
.norma{font-size:12px;border:1px solid var(--line-strong);border-radius:6px;padding:3px 8px;white-space:nowrap;color:var(--muted)}
.rev{background:var(--surface-2);border-radius:10px;padding:12px 16px}
.rev b{font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.rev ul{margin:6px 0 0;padding-left:20px}
.cond{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:10px;padding:10px 14px;font-size:15px}
.cond label{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
.cond input{width:20px;height:20px;accent-color:var(--green)}
.naBox{background:var(--yellow-soft);border:1px solid var(--yellow);border-radius:10px;padding:12px 14px}
.helper{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:15px}
.helper input{width:84px;height:40px;border:1.5px solid var(--line-strong);border-radius:8px;text-align:center;background:var(--surface)}
.helper b{font-family:var(--font-head);font-size:18px}
.opts{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0}
.opts legend{font-weight:700;margin-bottom:8px;padding:0}
.opt{position:relative;display:grid;grid-template-columns:28px 78px minmax(0,1fr);gap:10px;align-items:start;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:10px;cursor:pointer;background:var(--surface)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;margin-top:1px}
.opt .pt{font-family:var(--font-head);font-weight:700;font-size:18px;white-space:nowrap}
.opt:has(input:checked){background:var(--green);border-color:var(--green);color:var(--on-green)}
.opt:has(input:checked) .rd{border-color:var(--on-green)}
.opt:has(input:checked) .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--on-green)}
.opt:has(input:focus-visible){outline:3px solid var(--yellow);outline-offset:2px}
.opts[disabled]{opacity:.45}
.opts[disabled] .opt{cursor:not-allowed}
.ev{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ph{width:88px;height:66px;border-radius:8px;background:var(--surface-2);border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);position:relative}
.ph button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:13px;line-height:1;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:8px;border:2px solid var(--green);background:var(--surface);color:var(--green);font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.primary:hover{background:var(--green-dark);border-color:var(--green-dark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dash{border-style:dashed}
textarea{width:100%;min-height:84px;border:1.5px solid var(--line-strong);border-radius:8px;padding:10px 12px;background:var(--surface);resize:vertical}
.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 24px;display:flex;justify-content:flex-end;align-items:center;gap:16px;z-index:6}
.bar .stat{margin-right:auto;font-size:14px;color:var(--muted)}
.legal{margin-top:24px;font-size:12px;color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.scrim.open{display:flex}
.modal{background:var(--surface);border-radius:14px;border-top:6px solid var(--green);width:100%;max-width:540px;max-height:calc(100vh - 32px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-family:var(--font-head);font-size:22px}
.modal ul{margin:0;padding-left:20px}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:700;display:none;z-index:30;max-width:calc(100vw - 32px)}
.toast.show{display:block}
/* resultado */
.res-ok{display:flex;gap:12px;align-items:center;background:var(--green-soft);border:1.5px solid var(--green);border-radius:10px;padding:12px 16px;margin-bottom:18px;color:var(--green)}
.res-ok div{display:flex;flex-direction:column;color:var(--fg)}
.res-ok span{font-size:14px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-family:var(--font-head);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{font-size:13px;color:var(--muted)}
.kpi.main{border:2px solid var(--green);background:var(--green-soft)}
.kpi.main b{color:var(--green)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.blk{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.blk h2{margin:2px 0 0;font-family:var(--font-head);font-size:19px}
.dist{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.dist i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend span::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c)}
.rl{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.rl:last-child{border-bottom:0}
.rl span{min-width:0}
.crit{border-left:4px solid var(--danger);background:var(--danger-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.crit small{color:var(--muted)}
.next{margin-top:20px;background:var(--surface);border:2px solid var(--green);border-radius:12px;padding:16px 18px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.next div:first-child{display:flex;flex-direction:column;gap:2px;max-width:62ch}
.next span{color:var(--muted);font-size:15px}
.formula{font-size:14px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px;font-variant-numeric:tabular-nums}
@media (max-width:980px){
  .work{grid-template-columns:1fr}.list{display:none}
  .mobsel{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
  .mobsel select{height:48px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:0 10px;font-size:16px;font-weight:400}
  .grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .tb1{padding:10px 16px 8px}.steps{padding:0 16px 10px;gap:6px}.brand{display:none}
  .steps li:not(.on) span{visibility:hidden}.steps li.on span{overflow:visible;font-size:11px}
  .ttl b{font-size:17px}.ttl span{font-size:13px}
  main{padding:16px 16px 120px} h1{font-size:23px}
  .tabs{grid-template-columns:1fr 1fr;gap:8px}.tab{padding:10px 12px}.tab b{font-size:17px}.tab small{font-size:12px}
  .det{padding:16px}
  .opt{grid-template-columns:24px 72px minmax(0,1fr);padding:10px 12px;gap:8px}.opt .pt{font-size:16px}
  .bar{padding:10px 16px}.bar .stat{display:none}.bar .btn{width:100%}
  .next .row{width:100%}.next .btn{flex:1}
  .nav .btn{flex:1;padding:0 10px}
}
</style>
<style>
.back{background:transparent;cursor:pointer}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;margin-bottom:20px}
.score{border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:8px;border:2px solid var(--c);background:var(--s)}
.score .k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score .v{font-family:var(--font-head);font-weight:700;font-size:76px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.score .v small{font-size:32px}
.score .lv{font-family:var(--font-head);font-size:22px;font-weight:700}
.score p{margin:0}
.lvl-Excelente{--c:var(--green);--s:var(--green-soft)}
.lvl-Alto{--c:var(--green);--s:var(--green-soft)}
.lvl-Medio{--c:var(--warn);--s:var(--yellow-soft)}
.lvl-Bajo{--c:var(--danger);--s:var(--danger-soft)}
.scale{display:flex;flex-direction:column;gap:10px}
.sbar{position:relative;display:grid;grid-template-columns:50fr 25fr 15fr 10fr;height:34px;border-radius:8px;overflow:visible;margin-top:26px}
.sbar div{display:grid;place-items:center;font-size:13px;font-weight:700;color:#14231a}
.sbar div:first-child{border-radius:8px 0 0 8px}.sbar div:last-child{border-radius:0 8px 8px 0}
.mk{position:absolute;top:-26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:13px}
.mk::after{content:"";width:3px;height:44px;background:var(--fg);margin-top:2px;border-radius:2px}
.ticks{display:grid;grid-template-columns:50fr 25fr 15fr 10fr;font-size:12px;color:var(--muted)}
.lvl-list{display:flex;flex-direction:column;gap:6px;font-size:14px}
.lvl-list div{padding:6px 10px;border-radius:8px}
.lvl-list div.on{background:var(--surface-2);outline:2px solid var(--line-strong)}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px;border-bottom:2px solid var(--line-strong)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.tbl .r{text-align:right}
.tbl td small{display:block;color:var(--muted);font-size:13px}
.tbl tr.tt td{font-weight:700;border-top:2px solid var(--line-strong);border-bottom:0;font-size:18px}
.mini{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px;min-width:90px}
.mini i{display:block;height:100%;background:var(--green)}
.note{background:var(--yellow-soft);border:1px solid var(--yellow);border-radius:10px;padding:14px 16px;font-size:15px}
.note ol{margin:6px 0;padding-left:20px}
.det3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rl select{height:34px;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--surface);font-size:14px}
.sim{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.sim input{width:20px;height:20px;accent-color:var(--green)}
.sign{border:2px dashed var(--line-strong);border-radius:10px;background:var(--surface);touch-action:none;width:100%;height:150px;display:block;cursor:crosshair}
.control{height:46px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:0 12px;font-size:16px;width:100%;font-weight:400}
.f.err .control,.sign.err{border-color:var(--danger);background:var(--danger-soft)}
.msg{color:var(--danger);font-size:13px;font-weight:400}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--green);flex-shrink:0;margin-top:1px}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.done-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 20px}
.done-hero .ic{width:72px;height:72px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center}
@media (max-width:980px){.hero{grid-template-columns:1fr}.det3{grid-template-columns:1fr}}
@media (max-width:640px){.sbar div{font-size:10px;overflow:hidden;white-space:nowrap}.score .v{font-size:60px}.acts .btn{flex:1 1 100%}}
</style>

<header class="topbar">
  <div class="tb1">
    <button class="back" id="back" aria-label="Volver"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl"><b id="gname"></b><span id="sub"></span></div>
    <div class="brand"><span class="mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 3c-1 3-1 6 1 8M15 3c1 3 1 6-1 8"/><circle cx="12" cy="15" r="5"/></svg></span>Bienestar Cunícola</div>
  </div>
  <ol class="steps" aria-label="Etapas de la evaluación" id="steps">
    <li class="done"><span>I · Reunión inicial ✓</span></li>
    <li class="done"><span>II · Inspección del predio y del animal ✓</span></li>
    <li class="done"><span>III · Inspección documental ✓</span></li>
    <li class="on" aria-current="step"><span>IV · Resultados</span></li>
  </ol>
</header>
<main id="main"></main>
<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" id="modal"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
var IND={"MBR": [{"n": "Estado y acceso a comederos", "s": "7.1.1", "c": ""}, {"n": "Alimento balanceado", "s": "7.1.2", "c": ""}, {"n": "Acceso a forraje", "s": "7.1.3", "c": "Sistemas extensivos y semi intensivos"}, {"n": "Acceso a alimento en gazapos", "s": "7.1.4", "c": "Sistemas con cría"}, {"n": "Acceso y disponibilidad al agua de bebida", "s": "7.1.5", "c": ""}, {"n": "Estado de bebederos o chupos", "s": "7.1.6", "c": ""}, {"n": "Altura de bebederos o chupos", "s": "7.1.7", "c": ""}, {"n": "Alojamiento", "s": "7.1.8", "c": ""}, {"n": "Reposa patas", "s": "7.1.9", "c": "Predios que usan jaulas"}, {"n": "Nidales", "s": "7.1.10", "c": "Sistemas con cría"}, {"n": "Espacio disponible", "s": "7.1.11", "c": ""}, {"n": "Altura de las jaulas desde el piso", "s": "7.1.12", "c": ""}, {"n": "Iluminación", "s": "7.1.13", "c": ""}, {"n": "Ventilación", "s": "7.1.14", "c": ""}, {"n": "Protección contra depredadores", "s": "7.1.15", "c": ""}], "MBA": [{"n": "Comportamiento anormal", "s": "7.2.1", "c": ""}, {"n": "Animales totalmente estirados", "s": "7.2.2", "c": ""}, {"n": "Confort térmico", "s": "7.2.3", "c": ""}, {"n": "Torsión del cuello", "s": "7.2.4", "c": ""}, {"n": "Animales mojados", "s": "7.2.5", "c": ""}, {"n": "Suciedad", "s": "7.2.6", "c": ""}, {"n": "Sintomatología respiratoria", "s": "7.2.7", "c": ""}, {"n": "Secreción ocular", "s": "7.2.8", "c": ""}, {"n": "Condición corporal", "s": "7.2.9", "c": ""}, {"n": "Lesiones en el cuerpo", "s": "7.2.10", "c": ""}, {"n": "Enteropatía", "s": "7.2.11", "c": ""}, {"n": "Pododermatitis", "s": "7.2.12", "c": ""}, {"n": "Diarrea", "s": "7.2.13", "c": ""}, {"n": "Presencia de mastitis", "s": "7.2.14", "c": ""}, {"n": "Dermatitis o sarna", "s": "7.2.15", "c": ""}, {"n": "Animales aislados del contacto social", "s": "7.2.16", "c": ""}], "MBG": [{"n": "Mortalidad", "s": "7.3.1", "c": ""}, {"n": "Protocolo de manejo", "s": "7.3.2", "c": ""}, {"n": "Plan sanitario", "s": "7.3.3", "c": ""}, {"n": "Medicamentos veterinarios", "s": "7.3.4", "c": ""}, {"n": "Conocimiento y capacitación en bienestar animal", "s": "7.3.5", "c": ""}, {"n": "Protocolo de sacrificio para consumo humano", "s": "7.3.6", "c": "Predios que sacrifican para consumo humano"}, {"n": "Protocolo de sacrificio humanitario o eutanasia", "s": "7.3.7", "c": ""}, {"n": "Plan de contingencia para desastres naturales", "s": "7.3.8", "c": ""}]};
(function(){
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var fmt=function(x,d){return Number(x).toLocaleString('es-CO',{minimumFractionDigits:d||0,maximumFractionDigits:d||0})};
  /* Puntajes de ejemplo de las etapas II y III (prototipo sin conectar). null = no aplica */
  var ESC={
    pequeno:{granja:'Granja La Esperanza',mun:'Piedecuesta',tipo:'Pequeño',n:50,resp:'',
      MBR:[55,100,null,100,100,55,20,100,55,100,100,55,100,100,55],MBA:[55,100,100,100,100,20,100,100,55,100,100,20,100,100,100,100],MBG:[55,100,55,100,20,null,100,55]},
    mediano:{granja:'Cunícola El Roble',mun:'Floridablanca',tipo:'Mediano',n:80,
      MBR:[100,100,null,100,55,55,55,100,20,100,55,100,100,55,100],MBA:[100,55,100,100,100,55,55,100,55,100,100,20,100,100,55,100],MBG:[55,55,55,100,20,null,100,20]},
    intensivo:{granja:'Conejera San Isidro',mun:'Lebrija',tipo:'Intensivo',n:276,
      MBR:[55,100,null,55,55,20,55,55,0,55,20,100,55,55,100],MBA:[55,55,55,100,100,20,55,55,55,55,100,0,55,100,55,100],MBG:[0,55,55,100,20,100,100,20]}};
  /* Norma §5.4: MBR 30 %, MBA 60 %, MBG 10 %. §5.5: Excelente ≥ 90, Alto 75 a < 90, Medio 50 a < 75, Bajo < 50 */
  var GR=[{k:'MBR',t:'Basadas en los recursos',w:30},{k:'MBA',t:'Basadas en los animales',w:60},{k:'MBG',t:'Basadas en la gestión',w:10}];
  var LV=[{k:'Bajo',min:0,c:'var(--danger-soft)',d:'Se identifican deficiencias que requieren acciones a corto o mediano plazo.'},
          {k:'Medio',min:50,c:'var(--yellow-soft)',d:'Las afectaciones pueden deteriorar la condición de los animales si no se resuelven rápido.'},
          {k:'Alto',min:75,c:'var(--green-soft)',d:'Los animales presentan un buen bienestar, pero es susceptible de ser mejorado.'},
          {k:'Excelente',min:90,c:'var(--green)',d:'Bienestar óptimo e indicadores de bienestar positivo.'}];
  function nivel(t){for(var i=LV.length-1;i>=0;i--)if(t>=LV[i].min)return LV[i];return LV[0]}
  var st;
  function nuevo(k){var e=ESC[k];st={esc:k,sim:false,fin:false,p:{MBR:e.MBR.slice(),MBA:e.MBA.slice(),MBG:e.MBG.slice()}}}
  /* Interpretación del equipo: % del grupo = puntos ÷ (100 × indicadores que aplican) × 100; final = suma de aportes */
  function calc(){var r={},tot=0;GR.forEach(function(g){var v=st.p[g.k].filter(function(x){return x!==null}),pts=v.reduce(function(a,b){return a+b},0),max=v.length*100,pct=max?pts*100/max:0,ap=pct*g.w/100;
      r[g.k]={ap:v.length,na:st.p[g.k].length-v.length,pts:pts,max:max,pct:pct,aporte:ap};tot+=ap});r.tot=Math.round(tot*10)/10;r.nivel=nivel(r.tot);return r}
  function chip(p){if(p===null)return '<span class="chip cna">No aplica</span>';return '<span class="chip c'+p+'">'+p+'</span>'}

  function render(){
    var e=ESC[st.esc],r=calc(),L=r.nivel;
    $('#gname').textContent=e.granja;$('#sub').textContent=e.mun+' · '+e.tipo+' · Andrea Gómez, Evaluador';
    if(st.fin)return final(r);
    var pos=Math.min(99,Math.max(1,r.tot));
    var html='<h1>Etapa IV · Resultado de la evaluación</h1>'
      +'<div class="scen"><b>Escenario de prueba (solo prototipo):</b><div class="segb" role="group" aria-label="Escenario de prueba">'+['pequeno','mediano','intensivo'].map(function(k){return '<button type="button" data-s="'+k+'" aria-pressed="'+(k===st.esc)+'">'+ESC[k].tipo+'</button>'}).join('')+'</div>'
      +'<label class="sim"><input type="checkbox" id="sim"'+(st.sim?' checked':'')+'>Editar puntajes (simulación)</label></div>'
      +'<div class="hero"><section class="score lvl-'+L.k+'" aria-live="polite"><span class="k">Calificación final del predio · Norma §5.4</span><span class="v">'+fmt(r.tot,1)+'<small> %</small></span><span class="lv">'+L.k.toUpperCase()+' BIENESTAR</span><p>'+L.d+'</p><span class="meta">'+fmt(e.n)+' animales evaluados · 39 indicadores ('+(r.MBR.na+r.MBA.na+r.MBG.na)+' no aplica)</span></section>'
      +'<section class="blk scale"><div class="kicker">Escala de clasificación · §5.5</div>'
        +'<div class="sbar" role="img" aria-label="Escala: la calificación '+fmt(r.tot,1)+' % está en el nivel '+L.k+'">'+LV.map(function(l){return '<div style="background:'+l.c+(l.k==='Excelente'?';color:var(--on-green)':'')+'">'+l.k+'</div>'}).join('')+'<span class="mk" style="left:'+pos+'%">'+fmt(r.tot,1)+' %</span></div>'
        +'<div class="ticks"><span>0</span><span>50</span><span>75</span><span>90</span></div>'
        +'<div class="lvl-list">'+LV.slice().reverse().map(function(l){return '<div class="'+(l.k===L.k?'on':'')+'"><b>'+l.k+'</b> ('+(l.k==='Excelente'?'90 % o más':l.k==='Alto'?'75 a menos de 90 %':l.k==='Medio'?'50 a menos de 75 %':'menos de 50 %')+'): '+l.d+'</div>'}).join('')+'</div></section></div>'
      +'<section class="blk"><div class="kicker">Consolidado · Norma §5.4 y §6.4</div><h2>Aporte de cada grupo de medidas</h2><div class="tw"><table class="tbl"><thead><tr><th>Grupo de medidas</th><th class="r">Aplican</th><th class="r">Puntos / máximo</th><th>% cumplimiento</th><th class="r">Peso</th><th class="r">Aporte</th></tr></thead><tbody>'
        +GR.map(function(g){var x=r[g.k];return '<tr><td><b>'+g.k+'</b><small>'+g.t+'</small></td><td class="r">'+x.ap+' de '+(x.ap+x.na)+(x.na?'<small>'+x.na+' no aplica</small>':'')+'</td><td class="r">'+fmt(x.pts)+' / '+fmt(x.max)+'</td><td><b>'+fmt(x.pct,1)+' %</b><div class="mini"><i style="width:'+x.pct+'%"></i></div></td><td class="r">× '+g.w+' %</td><td class="r"><b>'+fmt(x.aporte,1)+'</b></td></tr>'}).join('')
        +'<tr class="tt"><td colspan="5">Calificación final (suma de aportes)</td><td class="r">'+fmt(r.tot,1)+' %</td></tr></tbody></table></div>'
        +'<div class="note"><b>Interpretación del equipo · cómo se calcula</b><ol><li>% de cada grupo = puntos obtenidos ÷ puntos máximos × 100. El máximo es 100 por cada indicador que <b>sí aplica</b>; los que no aplican se excluyen.</li><li>Calificación final = %MBR × 0,30 + %MBA × 0,60 + %MBG × 0,10.</li></ol>La norma (§5.4 y §5.5) define los pesos y la clasificación, pero no la fórmula para combinar los puntajes dentro de cada grupo ni qué hacer con los indicadores que no aplican. Esta fórmula es una interpretación del equipo y debe validarse con el ICA.</div></section>'
      +'<div class="det3" style="margin-top:20px">'+GR.map(function(g){return '<section class="blk"><div class="kicker">'+g.k+' · detalle</div><div>'+IND[g.k].map(function(it,i){var p=st.p[g.k][i];
          var ctl=st.sim?'<select data-g="'+g.k+'" data-i="'+i+'" aria-label="Puntaje de '+esc(it.n)+'">'+[100,55,20,0].map(function(v){return '<option value="'+v+'"'+(p===v?' selected':'')+'>'+v+'</option>'}).join('')+(it.c?'<option value="na"'+(p===null?' selected':'')+'>No aplica</option>':'')+'</select>':chip(p);
          return '<div class="rl"><span>'+(i+1)+'. '+esc(it.n)+'</span>'+ctl+'</div>'}).join('')+'</div></section>'}).join('')+'</div>';
    var crit=[],fort=0;GR.forEach(function(g){st.p[g.k].forEach(function(p,i){if(p!==null&&p<=20)crit.push({g:g.k,i:i,p:p});if(p===100)fort++})});
    html+='<div class="grid" style="margin-top:20px"><section class="blk"><div class="kicker">Plan de mejora</div><h2>Oportunidades de mejora ('+crit.length+')</h2><p class="meta" style="margin:0">Indicadores con 0 o 20 puntos, ordenados por peso del grupo.</p>'
        +(crit.length?crit.map(function(c){return '<div class="crit"><span><b>'+c.g+' '+(c.i+1)+'. '+esc(IND[c.g][c.i].n)+'</b> · '+c.p+' pts</span><small>Norma §'+IND[c.g][c.i].s+'</small></div>'}).join(''):'<p style="margin:0">Ningún indicador quedó en 0 o 20 puntos.</p>')+'</section>'
      +'<section class="blk"><div class="kicker">Fortalezas</div><h2>Indicadores en 100 puntos</h2><b style="font-family:var(--font-head);font-size:40px">'+fort+'</b><p class="meta" style="margin:0">de '+(r.MBR.ap+r.MBA.ap+r.MBG.ap)+' indicadores que aplican.</p></section></div>'
      +'<section class="blk" style="margin-top:20px"><div class="kicker">Cierre de la visita</div><h2>Firma del responsable del predio</h2>'
        +'<label class="f" id="w-resp">Nombre del responsable que acompañó la visita *<input class="control" id="resp" autocomplete="name" value="'+esc(ESC[st.esc].resp||'')+'"><span class="msg"></span></label>'
        +'<div class="f" id="w-sig"><span>Firma *</span><canvas class="sign" id="sig" aria-label="Espacio para firmar con el dedo o el mouse"></canvas><span class="msg" id="m-sig"></span><button class="link" type="button" id="clr" style="align-self:flex-start;font-size:14px">Borrar firma</button></div>'
        +'<label class="chk" id="w-ack"><input type="checkbox" id="ack">El responsable recibió los resultados y las oportunidades de mejora.</label>'
        +'<div class="acts"><button class="btn" id="rev">‹ Revisar calificaciones</button><button class="btn" id="pdf">Descargar informe PDF</button><button class="btn primary" id="send">Firmar y finalizar evaluación</button></div></section>'
      +'<p class="legal">Prototipo académico (UCC) basado en la Metodología de Bienestar Animal en Conejos v2.0 del ICA. No es un sitio oficial del ICA.</p>';
    $('#main').innerHTML=html;bind();
  }
  var firmado=false;
  function bind(){
    document.querySelectorAll('[data-s]').forEach(function(b){b.addEventListener('click',function(){nuevo(b.dataset.s);firmado=false;render();try{history.replaceState(null,'','#'+b.dataset.s)}catch(e){}})});
    $('#sim').addEventListener('change',function(){st.sim=this.checked;var y=window.scrollY;render();window.scrollTo(0,y);$('#sim').focus()});
    document.querySelectorAll('select[data-g]').forEach(function(s){s.addEventListener('change',function(){st.p[s.dataset.g][+s.dataset.i]=s.value==='na'?null:+s.value;var y=window.scrollY,g=s.dataset.g,i=s.dataset.i;render();window.scrollTo(0,y);var n=document.querySelector('select[data-g="'+g+'"][data-i="'+i+'"]');n&&n.focus({preventScroll:true});toast('Calificación recalculada: '+fmt(calc().tot,1)+' %')})});
    $('#resp').addEventListener('input',function(){ESC[st.esc].resp=this.value});
    $('#rev').addEventListener('click',function(){if(!st.sim){st.sim=true;render()}var d=$('.det3');d&&d.scrollIntoView({behavior:'smooth'});toast('Activé "Editar puntajes" para revisar las calificaciones.')});
    $('#pdf').addEventListener('click',function(){abrir('<h2 id="mt">Informe PDF</h2><p style="margin:0">En este prototipo no se genera el archivo. En la aplicación, el informe incluye la calificación, el detalle de los 39 indicadores, las oportunidades de mejora y la firma.</p><div class="row"><button class="btn primary" data-close>Entendido</button></div>')});
    $('#send').addEventListener('click',finalizar);
    $('#back').onclick=function(){location.href='Mis%20visitas%20Cun%C3%ADcola.html'};
    pad();
  }
  function pad(){var c=$('#sig'),ctx=c.getContext('2d'),dr=false,dpr=window.devicePixelRatio||1;
    function size(){var r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=r.height*dpr;ctx.scale(dpr,dpr);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.strokeStyle=getComputedStyle(document.body).color;firmado=false}
    size();
    function pt(e){var r=c.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
    c.addEventListener('pointerdown',function(e){dr=true;c.setPointerCapture(e.pointerId);var p=pt(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});
    c.addEventListener('pointermove',function(e){if(!dr)return;var p=pt(e);ctx.lineTo(p.x,p.y);ctx.stroke();firmado=true;c.classList.remove('err');$('#m-sig').textContent=''});
    c.addEventListener('pointerup',function(){dr=false});c.addEventListener('pointercancel',function(){dr=false});
    $('#clr').addEventListener('click',function(){ctx.clearRect(0,0,c.width,c.height);firmado=false});
  }
  function finalizar(){
    var ok=true,first=null,n=$('#resp').value.trim();
    var w=$('#w-resp');w.classList.toggle('err',!n);w.querySelector('.msg').textContent=n?'':'Escribe el nombre del responsable.';if(!n){ok=false;first=first||$('#resp')}
    $('#sig').classList.toggle('err',!firmado);$('#m-sig').textContent=firmado?'':'Falta la firma del responsable.';if(!firmado){ok=false;first=first||$('#sig')}
    if(!$('#ack').checked){ok=false;toast('Marca que el responsable recibió los resultados.');first=first||$('#ack')}
    if(!ok){first.focus();first.scrollIntoView({block:'center',behavior:'smooth'});return}
    var r=calc();
    abrir('<h2 id="mt">¿Finalizar la evaluación?</h2><p style="margin:0">Calificación final: <b>'+fmt(r.tot,1)+' % · '+r.nivel.k+'</b>. Después de finalizar no se pueden cambiar los puntajes.</p><div class="row"><button class="btn" data-close>Seguir revisando</button><button class="btn primary" id="ok">Finalizar</button></div>');
    $('#ok').addEventListener('click',function(){$('#scrim').classList.remove('open');st.fin=true;render();window.scrollTo(0,0)});
  }
  function final(r){
    $('#toast').classList.remove('show');
    var li=document.querySelectorAll('#steps li');li[3].className='done';li[3].removeAttribute('aria-current');li[3].firstChild.textContent='IV · Resultados ✓';
    var e=ESC[st.esc],ahora=new Date(),fecha=ahora.toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'})+' · '+ahora.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'});
    $('#main').innerHTML='<section class="blk done-hero"><span class="ic"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12l5 5 9-10"/></svg></span><h1 style="margin:0">Evaluación finalizada</h1><p class="meta" style="margin:0">'+fecha+' · firmada por '+esc(e.resp)+' y Andrea Gómez, Evaluador</p>'
      +'<div class="score lvl-'+r.nivel.k+'" style="max-width:420px;width:100%;align-items:center;margin-top:8px"><span class="k">Calificación final</span><span class="v">'+fmt(r.tot,1)+'<small> %</small></span><span class="lv">'+r.nivel.k.toUpperCase()+' BIENESTAR</span></div>'
      +'<div class="kpis" style="width:100%;max-width:760px;margin:8px 0 0">'+GR.map(function(g){return '<div class="kpi"><span>'+g.k+' · '+g.w+' %</span><b>'+fmt(r[g.k].pct,1)+' %</b><small>Aporta '+fmt(r[g.k].aporte,1)+' puntos</small></div>'}).join('')+'</div>'
      +'<p style="margin:0;max-width:60ch">La evaluación de <b>'+esc(e.granja)+'</b> quedó registrada y lista para enviar al sistema. El productor recibe el informe con las oportunidades de mejora.</p>'
      +'<div class="acts" style="justify-content:center"><button class="btn" id="pdf2">Descargar informe PDF</button><button class="btn primary" id="env">Enviar al sistema</button></div></section>'
      +'<p class="legal">Prototipo académico (UCC) basado en la Metodología de Bienestar Animal en Conejos v2.0 del ICA. No es un sitio oficial del ICA.</p>';
    $('#pdf2').addEventListener('click',function(){abrir('<h2 id="mt">Informe PDF</h2><p style="margin:0">En este prototipo no se genera el archivo.</p><div class="row"><button class="btn primary" data-close>Entendido</button></div>')});
    $('#env').addEventListener('click',function(){var b=$('#env');b.disabled=true;b.textContent='Enviando…';setTimeout(function(){b.textContent='Enviada ✓';toast('Evaluación enviada. Volviendo a Mis visitas…');setTimeout(function(){location.href='Mis%20visitas%20Cun%C3%ADcola.html'},1500)},900)});
  }
  var lastFocus;
  function abrir(h){lastFocus=document.activeElement;$('#modal').innerHTML=h;$('#scrim').classList.add('open');var b=$('#modal').querySelector('button.primary')||$('#modal').querySelector('button');b&&b.focus();
    $('#modal').querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',cerrar)})}
  function cerrar(){$('#scrim').classList.remove('open');lastFocus&&document.body.contains(lastFocus)&&lastFocus.focus()}
  $('#scrim').addEventListener('click',function(e){if(e.target.id==='scrim')cerrar()});
  document.addEventListener('keydown',function(e){if(!$('#scrim').classList.contains('open'))return;if(e.key==='Escape')cerrar();
    if(e.key==='Tab'){var els=$('#modal').querySelectorAll('button');if(!els.length)return;var a=els[0],z=els[els.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
  var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},3000)}
  $('#back').addEventListener('click',function(){location.href='Mis%20visitas%20Cun%C3%ADcola.html'});
  var h=(location.hash||'').slice(1);nuevo(ESC[h]?h:'pequeno');render();
})();
</script>

</body></html>
